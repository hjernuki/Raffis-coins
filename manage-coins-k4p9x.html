    :root {
      --gold: #D4AF37;
      --gold-light: #F5E6A8;

    header p { margin: 0.25rem 0 0; color: var(--muted); }
    .container { max-width: 1300px; margin: 0 auto; padding: 1.5rem 1rem; }
    .btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover { background: var(--gold-light); }
    .btn-secondary { background: #2A3038; color: var(--text); }
    .btn-secondary:hover { background: #3A4048; }
